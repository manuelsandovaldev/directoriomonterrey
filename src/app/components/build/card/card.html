<mat-card class="example-card" appearance="outlined">
  <div class="status-badge-corner">
    <div class="status-badge" [class.is-open]="mockIsOpen" [class.is-closed]="!mockIsOpen">
      <span class="status-dot"></span>
      <span class="status-text">{{ mockIsOpen ? 'Abierto' : 'Cerrado' }}</span>
    </div>
  </div>

  <mat-card-header>
    <img mat-card-avatar [src]="conector().logo" alt="Logo de {{ conector().title }}" style="object-fit: cover;">
    <mat-card-title style="color: black;">
      <span style="word-wrap: break-word; white-space: normal;">
        {{ conector().title }}
      </span>
    </mat-card-title>
  </mat-card-header>
  <img mat-card-image [src]="conector().imagenes[0]" alt="Photo of {{ conector().title }}">
  <mat-card-content>
    <p>
      {{ conector().description }}
    </p>
  </mat-card-content>

  <mat-card-actions align="end">
    <button mat-raised-button color="primary" class="btn-ver-mas" (click)="onCardClick()">Ver más</button>
  </mat-card-actions>
</mat-card>
